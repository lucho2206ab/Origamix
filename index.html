<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self';">
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="apple-mobile-web-app-title" content="OrigaMix">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    #ui-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 6px;
      width: 100%;
      background: rgba(0,0,0,0.5);
    }
    #scores {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 8px;
      font-size: 13px;
      color: #e0e0e0;
    }
    canvas#game {
      max-width: 100vw;
      max-height: calc(100dvh - 80px);
      width: auto;
      height: auto;
      display: block;
      touch-action: none;
    }
    /* Mobile landscape: maximize canvas */
    @media (max-height: 500px) {
      #ui-bar { padding: 3px; gap: 4px; font-size: 11px; }
      canvas#game { max-height: calc(100dvh - 50px); }
    }
    /* Prevent text selection on touch */
    #app { user-select: none; -webkit-user-select: none; }

    /* D-pad overlay */
    #dpad {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 100;
      opacity: 0.82;
      touch-action: none;
    }

    #dpad-cross {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .dpad-middle-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
    }

    .dpad-btn {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: 2px solid rgba(0, 207, 255, 0.6);
      background: rgba(13, 13, 30, 0.85);
      color: #00cfff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.1s, transform 0.08s;
      touch-action: manipulation;
    }

    .dpad-btn:active,
    .dpad-btn.pressed {
      background: rgba(0, 207, 255, 0.25);
      transform: scale(0.92);
      border-color: #00cfff;
    }

    .dpad-center {
      width: 52px;
      height: 52px;
      font-size: 22px;
      background: rgba(30, 13, 40, 0.85);
      border-color: rgba(170, 0, 255, 0.6);
      color: #aa00ff;
    }

    .dpad-center:active,
    .dpad-center.pressed {
      background: rgba(170, 0, 255, 0.25);
      border-color: #aa00ff;
    }

    /* Only show dpad on touch devices during active game */
    @media (hover: none) and (pointer: coarse) {
      #app.game-active #dpad { display: block !important; }
    }

    /* ── MOBILE PORTRAIT OPTIMIZATION ─────────────────────────── */
    @media (max-width: 600px) and (orientation: portrait) {

      body {
        justify-content: flex-start;
        background: #020814;
        overflow: hidden;
      }

      #app {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        padding: 0;
        border: none;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
        justify-content: flex-start;
        gap: 0;
      }

      /* Hide normal ui-bar and scores — replaced by overlay */
      #ui-bar {
        display: none !important;
      }
      #scores {
        display: none !important;
      }

      /* Canvas fills available space */
      canvas#game {
        width: 100vw !important;
        height: auto !important;
        max-width: 100vw !important;
        max-height: calc(100dvh - 180px) !important;
        margin-top: 0 !important;
        display: block;
      }

      #app.game-active canvas#game {
        max-height: calc(100dvh - 180px) !important;
        margin-top: 36px !important;
        width: 100vw !important;
        height: auto !important;
        max-width: 100vw !important;
        border-radius: 0 !important;
        border-left: none !important;
        border-right: none !important;
      }

      /* Compact mobile top bar overlaid on canvas */
      #mobile-topbar {
        display: flex !important;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background: rgba(1, 5, 20, 0.75);
        backdrop-filter: blur(4px);
        padding: 6px 12px;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        pointer-events: auto;
      }

      #mobile-topbar .mob-name-group {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      #mobile-topbar input {
        background: rgba(26, 26, 46, 0.9);
        border: 1px solid rgba(122, 252, 255, 0.3);
        border-radius: 6px;
        padding: 5px 10px;
        font: 12px 'Courier New', monospace;
        color: #e0e0e0;
        outline: none;
        width: 110px;
      }

      #mobile-topbar button {
        border-radius: 6px;
        padding: 5px 10px;
        font: bold 12px 'Courier New', monospace;
        cursor: pointer;
        border: 1px solid rgba(122, 252, 255, 0.4);
        background: transparent;
        color: #7afcff;
      }

      #mobile-topbar #mob-start {
        background: #00cc66;
        color: #0d0d0d;
        border-color: transparent;
      }

      #mobile-topbar #mob-reset {
        background: #c8960c;
        color: #0d0d0d;
        border-color: transparent;
      }

      #mobile-topbar .mob-score {
        font: bold 12px 'Courier New', monospace;
        color: #c8960c;
        text-shadow: 0 0 8px rgba(200, 150, 12, 0.5);
        white-space: nowrap;
      }

      /* D-pad: fixed at bottom of screen, compact */
      #app.game-active #dpad {
        display: flex !important;
        position: fixed !important;
        bottom: 8px !important;
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%);
        width: auto !important;
        padding: 4px 8px !important;
        background: rgba(1, 5, 20, 0.8) !important;
        border-radius: 16px;
        border: 1px solid rgba(122, 252, 255, 0.15);
        backdrop-filter: blur(6px);
        opacity: 0.92 !important;
      }

      .dpad-btn {
        width: 44px !important;
        height: 44px !important;
        font-size: 17px !important;
        border-radius: 10px !important;
      }

      .dpad-center {
        width: 44px !important;
        height: 44px !important;
        font-size: 19px !important;
      }

      #dpad-cross {
        gap: 3px !important;
      }

      .dpad-middle-row {
        gap: 3px !important;
      }

      /* Score overlay — shown only during game, fixed top */
      #mobile-score-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        background: rgba(1, 5, 20, 0.82);
        backdrop-filter: blur(4px);
        padding: 5px 14px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        font: bold 12px 'Courier New', monospace;
        color: #7afcff;
        border-bottom: 1px solid rgba(122, 252, 255, 0.12);
      }

      #app.game-active #mobile-score-overlay {
        display: flex !important;
      }

      .mob-reset-btn {
        background: #c8960c;
        color: #0d0d0d;
        border: none;
        border-radius: 6px;
        padding: 4px 10px;
        font: bold 11px 'Courier New', monospace;
        cursor: pointer;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .mob-reset-btn:active {
        opacity: 0.8;
        transform: scale(0.96);
      }

      /* Push canvas down to avoid score overlay overlap */
      #app.game-active canvas#game {
        margin-top: 32px !important;
      }
    }

/* Desktop/landscape: mobile-topbar always hidden */
#mobile-topbar {
  display: none;
}

/* Desktop: mobile-score-overlay always hidden */
#mobile-score-overlay {
  display: none !important;
}
  </style>
    <title>origamix</title>
  </head>
  <body>
    <div id="app" style="position:relative">
      <!-- Mobile score overlay (shows during gameplay) -->
      <div id="mobile-score-overlay">
        <span id="mob-score-puntaje">Puntaje: 0</span>
        <span id="mob-score-nivel">Nivel: 1</span>
        <span id="mob-score-lineas">Líneas: 0</span>
        <button id="mob-reset-overlay" class="mob-reset-btn">↻ Reset</button>
      </div>
      <!-- Mobile top bar (portrait only) -->
      <div id="mobile-topbar" style="display:none">
        <div class="mob-name-group">
          <input id="mob-player-name" type="text" placeholder="Tu nombre" maxlength="20">
          <button id="mob-name-ok">OK</button>
          <span id="mob-name-confirmed" style="color:#00ff88;font:bold 14px monospace;opacity:0;transition:opacity .3s">✓</span>
        </div>
        <button id="mob-start" disabled>▶ START</button>
        <button id="mob-reset" style="display:none">↻ NEW</button>
        <div class="mob-score">
          <span>🏆 </span><span id="mob-high-score">--</span>
        </div>
      </div>
      <div id="ui-bar">
        <div id="name-group">
          <input id="player-name" type="text" placeholder="Tu nombre" maxlength="20">
          <button id="name-ok">OK</button>
          <span id="name-confirmed">✓</span>
        </div>
        <span id="player-name-display"></span>
        <button id="start" disabled>▶ START</button>
        <button id="reset">↻ New Game</button>
      </div>
      <div id="scores">
        <span id="high-label">🏆 High Score</span>
        <span id="high-score">--</span>
      </div>
      <canvas id="game" width="760" height="650"></canvas>
      <!-- Virtual D-pad for mobile -->
      <div id="dpad" style="display:none">
        <div id="dpad-cross">
          <button class="dpad-btn" id="btn-up"    data-code="ArrowUp">▲</button>
          <div class="dpad-middle-row">
            <button class="dpad-btn" id="btn-left"  data-code="ArrowLeft">◄</button>
            <button class="dpad-btn dpad-center" id="btn-rotate" data-code="Space">↺</button>
            <button class="dpad-btn" id="btn-right" data-code="ArrowRight">►</button>
          </div>
          <button class="dpad-btn" id="btn-down"  data-code="ArrowDown">▼</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
